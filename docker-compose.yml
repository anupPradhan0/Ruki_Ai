services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rukiai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env so the containerized backend talks to Ollama running on
      # the HOST (not inside the container). Works on Linux thanks to the
      # extra_hosts mapping below; works out-of-the-box on Docker Desktop.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rukiai_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: rukiai_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${mongo_root_user}
      MONGO_INITDB_ROOT_PASSWORD: ${mongo_root_password}
      MONGO_INITDB_DATABASE: ${db_name}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
