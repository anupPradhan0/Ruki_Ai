services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rukiai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Talk to Ollama on the HOST via the compose-network gateway. The
      # default `host.docker.internal:host-gateway` resolves to docker0's IP
      # (172.17.0.1), which doesn't work here because docker0 is DOWN on this
      # machine. The compose-network gateway (172.21.0.1) is up and routes
      # back to the host. UFW must allow 172.16.0.0/12 -> port 11434.
      # Lowercase key to override the lowercase value in .env (pydantic-settings
      # is case-insensitive and matches the .env spelling first).
      ollama_host: http://172.21.0.1:11434
      # Inside the container, "localhost" is the container itself — point at
      # the compose service name instead so the backend can reach Mongo.
      # Must match the lowercase key in .env so pydantic-settings picks this
      # override over the env_file value.
      mongo_uri: mongodb://${mongo_root_user}:${mongo_root_password}@mongo:27017
      qdrant_url: http://qdrant:6333
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rukiai_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: rukiai_mongo
    # No host port published — the backend container reaches mongo on the
    # internal docker network as `mongo:27017`. If you need to connect from
    # the host (Compass, local uvicorn), re-add `ports: ["27018:27017"]` and
    # update backend/.env's mongo_uri to use port 27018.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${mongo_root_user}
      MONGO_INITDB_ROOT_PASSWORD: ${mongo_root_password}
      MONGO_INITDB_DATABASE: ${db_name}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rukiai_qdrant
    # No host port exposed by default — backend reaches it on the compose network.
    # Uncomment the ports block to use the Qdrant dashboard from the host
    # (http://localhost:6333/dashboard).
    # ports:
    #   - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
